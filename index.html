<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Portfolio</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-link: #58a6ff;
      --accent: #238636;
      --badge-bg: #21262d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #fff;
    }

    /* Grid Layout: Columns adjust automatically based on screen size */
    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* Lively Hover Effects */
    .repo-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .repo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border-color: var(--text-link);
    }

    .repo-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--text-link);
      text-decoration: none;
      margin-bottom: 8px;
      display: inline-block;
    }

    .repo-title:hover {
      text-decoration: underline;
    }

    .repo-desc {
      font-size: 0.95rem;
      color: #8b949e;
      flex-grow: 1;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .repo-meta {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 0.85rem;
      color: #8b949e;
    }

    .badge {
      background-color: var(--badge-bg);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ My Projects</h1>
    <p>Automatically synced from my GitHub account</p>
  </header>

  <div id="repo-grid" class="repo-grid">Loading repositories...</div>

  <script>
  // Fetches the static JSON file created by GitHub Actions
  fetch('./repos.json')
    .then(response => {
      if (!response.ok) {
        throw new Error('repos.json not generated yet');
      }
      return response.json();
    })
    .then(repos => {
      const container = document.getElementById('repo-grid');
      container.innerHTML = ''; 

      if (!Array.isArray(repos) || repos.length === 0) {
        container.innerText = 'No public repositories found.';
        return;
      }

      repos.forEach(repo => {
  if (!repo.fork) {
    // Generates the live GitHub Pages URL for each repository
    const liveUrl = `https://${repo.owner.login}.github.io/${repo.name}/`;

    const card = document.createElement('div');
    card.className = 'repo-card';
    card.innerHTML = `
      <div>
        <a class="repo-title" href="${liveUrl}" target="_blank">🌐 ${repo.name}</a>
        <p class="repo-desc">${repo.description || 'No description provided.'}</p>
      </div>
      <div class="repo-meta">
        ${repo.language ? `<span class="badge">${repo.language}</span>` : ''}
        <a href="${repo.html_url}" target="_blank" style="color: #8b949e; text-decoration: none;">💻 Source Code</a>
        <span>⭐ ${repo.stargazers_count}</span>
        <span>🍴 ${repo.forks_count}</span>
      </div>
    `;
    container.appendChild(card);
  }
});
    })
    .catch(err => {
      console.error(err);
      document.getElementById('repo-grid').innerText = 'Generating project list... If this is your first build, please trigger the action manually or wait 1 minute.';
    });
</script>
