<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Projects</title>
  <style>
    :root {
      --outer-bg: #e2dad5;
      --canvas-bg: rgba(255, 252, 248, 0.65);
      --text-main: #2d2623;
      --text-sub: #63564f;
      --canvas-shadow: 0 30px 60px rgba(110, 95, 85, 0.18), 0 10px 20px rgba(0, 0, 0, 0.05);
      --card-shadow: 0 10px 25px rgba(180, 160, 150, 0.15);
      --card-shadow-hover: 0 18px 35px rgba(140, 115, 100, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--outer-bg);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Main Floating App Canvas */
    .app-canvas {
      position: relative;
      width: calc(100vw - 60px);
      height: calc(100vh - 60px);
      max-width: 1280px;
      max-height: 900px;
      background-color: var(--canvas-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--canvas-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Vibrant Background Mesh */
    .bg-mesh {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.85;
    }

    .blob-1 { width: 600px; height: 600px; background: #fcd5ce; top: -100px; left: -100px; }
    .blob-2 { width: 650px; height: 650px; background: #ffb703; top: 20%; left: 15%; opacity: 0.55; }
    .blob-3 { width: 700px; height: 700px; background: #80ed99; bottom: -200px; right: -100px; opacity: 0.6; }
    .blob-4 { width: 550px; height: 550px; background: #4cc9f0; bottom: -100px; right: 25%; opacity: 0.5; }

    /* Scrollable Inner Content Area */
    .content-area {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 50px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: #2b231f;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 300;
      margin: 0;
    }

    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }

    /* Interactive Color Card Box */
    .repo-card {
      position: relative;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: var(--card-shadow);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      text-decoration: none;
      min-height: 160px;
      overflow: hidden;
      cursor: pointer;
    }

    .repo-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: var(--card-shadow-hover);
    }

    .repo-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.2px;
      text-transform: capitalize;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      margin: 0;
      z-index: 2;
    }

    /* Hover Description Overlay */
    .repo-desc {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 24px;
      font-size: 0.88rem;
      line-height: 1.5;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 20px;
      z-index: 3;
    }

    /* Card Hover State Actions */
    .repo-card:hover .repo-title {
      transform: translateY(-40px);
      opacity: 0;
    }

    .repo-card:hover .repo-desc {
      opacity: 1;
      transform: translateY(0);
    }

    /* Dynamic Distinct Card Color Palettes */
    .color-1 { background: rgba(255, 230, 225, 0.85); border: 1px solid rgba(255, 200, 190, 0.9); }
    .color-1 .repo-title, .color-1 .repo-desc { color: #8e321e; background: rgba(255, 230, 225, 0.95); }

    .color-2 { background: rgba(254, 243, 199, 0.85); border: 1px solid rgba(253, 224, 71, 0.7); }
    .color-2 .repo-title, .color-2 .repo-desc { color: #854d0e; background: rgba(254, 243, 199, 0.95); }

    .color-3 { background: rgba(220, 252, 231, 0.85); border: 1px solid rgba(134, 239, 172, 0.8); }
    .color-3 .repo-title, .color-3 .repo-desc { color: #166534; background: rgba(220, 252, 231, 0.95); }

    .color-4 { background: rgba(224, 242, 254, 0.85); border: 1px solid rgba(125, 211, 252, 0.8); }
    .color-4 .repo-title, .color-4 .repo-desc { color: #075985; background: rgba(224, 242, 254, 0.95); }

    .color-5 { background: rgba(243, 232, 255, 0.85); border: 1px solid rgba(216, 180, 254, 0.8); }
    .color-5 .repo-title, .color-5 .repo-desc { color: #6b21a8; background: rgba(243, 232, 255, 0.95); }

    .color-6 { background: rgba(252, 231, 243, 0.85); border: 1px solid rgba(249, 168, 212, 0.8); }
    .color-6 .repo-title, .color-6 .repo-desc { color: #9d174d; background: rgba(252, 231, 243, 0.95); }

    .color-7 { background: rgba(255, 237, 213, 0.85); border: 1px solid rgba(253, 186, 116, 0.8); }
    .color-7 .repo-title, .color-7 .repo-desc { color: #9a3412; background: rgba(255, 237, 213, 0.95); }

    .status-msg {
      text-align: center;
      color: var(--text-sub);
      font-weight: 300;
      grid-column: 1 / -1;
      padding: 40px;
    }

    @media (max-width: 768px) {
      .app-canvas {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: none;
      }
      .content-area {
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="app-canvas">
    
    <div class="bg-mesh">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
    </div>

    <div class="content-area">
      <header>
        <h1>Projects</h1>
        <p>Hover over any project box to read the description</p>
      </header>

      <div id="repo-grid" class="repo-grid">
        <div class="status-msg">Gathering projects...</div>
      </div>
    </div>

  </div>

  <script>
  fetch('./repos.json')
    .then(response => {
      if (!response.ok) throw new Error('repos.json not available');
      return response.json();
    })
    .then(repos => {
      const container = document.getElementById('repo-grid');
      container.innerHTML = ''; 

      if (!Array.isArray(repos) || repos.length === 0) {
        container.innerHTML = '<div class="status-msg">No projects available at the moment.</div>';
        return;
      }

      // Sort alphabetically
      const validRepos = repos
        .filter(repo => !repo.fork)
        .sort((a, b) => a.name.localeCompare(b.name));

      const colorCount = 7;

      validRepos.forEach((repo, index) => {
        const liveUrl = repo.name === `${repo.owner.login}.github.io`
          ? `https://${repo.owner.login}.github.io/`
          : `https://${repo.owner.login}.github.io/${repo.name}/`;

        const cleanTitle = repo.name
          .replace(/-/g, ' ')
          .replace(/([a-z])([A-Z])/g, '$1 $2');

        // Assign a distinct color theme class iteratively
        const colorClass = `color-${(index % colorCount) + 1}`;

        const card = document.createElement('a');
        card.className = `repo-card ${colorClass}`;
        card.href = liveUrl;
        card.target = '_blank';
        card.innerHTML = `
          <h2 class="repo-title">${cleanTitle}</h2>
          <div class="repo-desc">${repo.description || 'Interactive web application and spatial project.'}</div>
        `;
        container.appendChild(card);
      });
    })
    .catch(err => {
      console.error(err);
      document.getElementById('repo-grid').innerHTML = '<div class="status-msg">Unable to load project showcase right now.</div>';
    });
</script>

</body>
</html>
