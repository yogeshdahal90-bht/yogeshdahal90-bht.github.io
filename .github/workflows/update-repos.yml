name: Update Repositories JSON

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at midnight
  workflow_dispatch:     # Enables a manual "Run workflow" button in GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit the JSON file back to your repo
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch Repositories Data
        run: |
          curl -s "https://api.github.com/users/yogeshdahal90-bht/repos?sort=updated&per_page=100" > repos.json

      - name: Commit and Push repos.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update repos.json" && git push)
